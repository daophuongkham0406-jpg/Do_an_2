<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập & Đăng ký</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dangnhap.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div class="form-container sign-up">
        <form id="register-form">
          <a href="dangnhap.html" class="back-btn-inner">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span>Quay lại</span>
          </a>

          <h1>Tạo tài khoản</h1>
          <p class="subtitle">Nhập thông tin để đăng ký</p>

          <div class="form-row">
            <input type="text" id="reg-name" placeholder="Họ và tên" required />
            <input
              type="number"
              id="reg-age"
              placeholder="Tuổi"
              min="1"
              max="120"
              style="width: 80px"
              required
            />
          </div>

          <div class="gender-group">
            <div class="gender-option">
              <input type="radio" name="gender" id="g-male" value="nam" />
              <label for="g-male">♂ Nam</label>
            </div>
            <div class="gender-option">
              <input type="radio" name="gender" id="g-female" value="nu" />
              <label for="g-female">♀ Nữ</label>
            </div>
            <div class="gender-option">
              <input type="radio" name="gender" id="g-other" value="khac" />
              <label for="g-other">⊘ Khác</label>
            </div>
          </div>

          <input
            type="text"
            id="reg-username"
            placeholder="Tên đăng nhập"
            required
          />
          <input
            type="email"
            id="reg-email"
            placeholder="Địa chỉ Email (@gmail.com)"
            required
          />
          <div class="password-wrap">
            <input
              type="password"
              id="reg-pass"
              placeholder="Mật khẩu (tối thiểu 8 ký tự)"
              required
            />
          </div>

          <div class="password-wrap">
            <input
              type="password"
              id="reg-confirm"
              placeholder="Xác nhận mật khẩu"
              required
            />
          </div>

          <button type="submit">Đăng ký</button>
        </form>
      </div>

      <div class="form-container sign-in">
        <form id="login-form">
          <a href="index.html" class="back-btn-inner">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span>Quay lại</span>
          </a>

          <h1>Đăng nhập</h1>
          <p class="subtitle">Chào mừng trở lại!</p>

          <input
            type="email"
            id="login-email"
            placeholder="Địa chỉ Email"
            required
          />

          <div class="password-wrap">
            <input
              type="password"
              id="login-pass"
              placeholder="Mật khẩu"
              required
            />
          </div>

          <div class="forgot"><a href="#">Quên mật khẩu?</a></div>

          <button type="submit">Đăng nhập</button>
        </form>
      </div>

      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h1>Chào mừng trở lại!</h1>
            <p>Để quay lại trang đăng nhập, vui lòng nhấn nút bên dưới</p>
            <button class="hidden" id="login">Đăng nhập</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Xin chào!</h1>
            <p>Nhập thông tin cá nhân của bạn để đăng ký tài khoản mới</p>
            <button class="hidden" id="register">Đăng ký</button>
          </div>
        </div>
      </div>
    </div>
    <div class="toast-wrap" id="toastWrap"></div>
    <script src="function_proc/dangnhap.js"></script>
  </body>
</html>
